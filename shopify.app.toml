# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "840a22df2708a4a51a443180b8c332db"
application_url = "https://practitioner-protocols-production.up.railway.app"
embedded = true
name = "Practitioner Protocols"

[access_scopes]
# Minimal scopes required: read_orders for orders/paid attribution.
scopes = "read_orders"

[app_proxy]
url = "https://practitioner-protocols-production.up.railway.app/api/proxy"
subpath = "protocols"
prefix = "apps"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[auth]
redirect_urls = [
  "https://practitioner-protocols-production.up.railway.app/api/auth",
  "https://practitioner-protocols-production.up.railway.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
